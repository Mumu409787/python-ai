[project]
name = "python-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.2",
    "langchain-community<0.4",
    "langchain-openai>=1.6.4",
    "langfuse>=4.15.4",
    "langgraph>=1.2.12",
    "mcp[cli]>=2.3.0",
    "openai>=3.19.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "ragas>=0.3.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "sse-starlette>=3.5.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
python-ai = "python_ai.main:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
